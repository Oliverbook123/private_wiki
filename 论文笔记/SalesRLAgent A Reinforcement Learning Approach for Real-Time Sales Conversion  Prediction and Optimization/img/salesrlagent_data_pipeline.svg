<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#C62828"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill:#333; }
    .h1 { font-size:24px; font-weight:bold; fill:#111; }
    .sub { font-size:14px; fill:#666; }
    .h2 { font-size:18px; font-weight:bold; fill:#111; }
    .bt { font-size:15px; font-weight:bold; fill:#111; }
    .item { font-size:13px; }
    .lbl { font-size:13px; fill:#222; }
    .bar { font-size:15px; font-weight:bold; }
  </style>

  <rect x="0" y="0" width="1140" height="720" fill="#FDFDFD"/>

  <!-- 标题 -->
  <text class="h1" x="570" y="38" text-anchor="middle">数据准备流程:没有真实数据,全靠 GPT-4o 造</text>
  <text class="sub" x="570" y="62" text-anchor="middle">不是蒸馏:GPT-4o 只造对话文本,不给软标签;学生的训练信号是"最终成交与否",不是 GPT-4o 的输出分布</text>

  <!-- ============ ① 合成生成 ============ -->
  <text class="h2" x="30" y="105">① 合成生成(数据工厂)</text>

  <!-- 合成手段 -->
  <rect x="30" y="125" width="250" height="300" rx="10" fill="#FFF4E0" stroke="#D9822B" stroke-width="2"/>
  <text class="bt" x="155" y="153" text-anchor="middle">四个手段(原文口径)</text>
  <line x1="50" y1="165" x2="260" y2="165" stroke="#D9822B" stroke-width="1" opacity="0.5"/>
  <text class="item" x="50" y="190">1. Advanced 提示词让 GPT-4o 开写</text>
  <text class="item" x="50" y="220">2. 15 个行业场景模板定戏路</text>
  <text class="item" x="50" y="250">3. 程序化改参数:</text>
  <text class="item" x="50" y="275">　 长度 / 风格 / 异议类型</text>
  <text class="item" x="50" y="305">4. 多个 LLM agent 模拟买卖双方</text>
  <text class="item" x="50" y="340">每个 LLM 装一个角色来回对话</text>
  <text class="item" x="50" y="400">共造出 120 万条</text>

  <!-- ============ ② 数据集 ============ -->
  <text class="h2" x="400" y="105">② 数据集(每条带什么)</text>

  <!-- 数据集 -->
  <rect x="400" y="125" width="330" height="300" rx="10" fill="#E8EEF7" stroke="#4A6FA5" stroke-width="2"/>
  <text class="bt" x="565" y="153" text-anchor="middle">每条对话的标注(流程给的)</text>
  <line x1="420" y1="165" x2="710" y2="165" stroke="#4A6FA5" stroke-width="1" opacity="0.5"/>
  <text class="item" x="420" y="190">完整 transcript</text>
  <text class="item" x="420" y="215">说话人标注(客户 vs 销售)</text>
  <text class="item" x="420" y="245">最终成交与否(二元标签)</text>
  <text class="item" x="420" y="270">　 ← 这是唯一的"正确答案"</text>
  <text class="item" x="420" y="300">逐轮成交概率标注(时间戳化)</text>
  <text class="item" x="420" y="330">模拟客户参与度指标</text>
  <text class="item" x="420" y="360">产品/行业标签</text>
  <text class="item" x="420" y="395">注:标签是流程设定的,不是真成交记录</text>

  <!-- ============ ③ 数据先验 ============ -->
  <text class="h2" x="830" y="105">③ 长什么样(先验分布)</text>

  <!-- 先验 -->
  <rect x="830" y="125" width="280" height="300" rx="10" fill="#EAF7EA" stroke="#2E7D32" stroke-width="2"/>
  <text class="bt" x="970" y="153" text-anchor="middle">120 万条的分布</text>
  <line x1="850" y1="165" x2="1090" y2="165" stroke="#2E7D32" stroke-width="1" opacity="0.5"/>
  <text class="item" x="850" y="190">覆盖 15 个行业</text>
  <text class="item" x="850" y="220">对话 3~27 轮</text>
  <text class="item" x="850" y="250">中位数 8 轮</text>
  <text class="item" x="850" y="280">正负样本大致均衡</text>
  <text class="item" x="850" y="310">但负样本略多:56%</text>
  <text class="item" x="850" y="340">　 (贴合成率偏低的现实)</text>
  <text class="item" x="850" y="400">训练/验证/测试没披露</text>

  <!-- 箭头 -->
  <text class="lbl" x="340" y="252" text-anchor="middle">120 万条</text>
  <line x1="285" y1="264" x2="395" y2="264" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text class="lbl" x="780" y="252" text-anchor="middle">成形的标注集</text>
  <line x1="735" y1="264" x2="825" y2="264" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- ============ ④ 预处理 ============ -->
  <text class="h2" x="30" y="480">④ 预处理五步(训练前最后加工)</text>

  <!-- 五步链条 -->
  <rect x="50" y="510" width="190" height="90" rx="8" fill="#FFF4E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="bt" x="145" y="548" text-anchor="middle">1 清洗规范化</text>
  <text class="item" x="60" y="578">(去噪、统一格式)</text>
  <line x1="245" y1="555" x2="290" y2="555" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="295" y="510" width="190" height="90" rx="8" fill="#FFF4E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="bt" x="390" y="548" text-anchor="middle">2 实体标准化</text>
  <text class="item" x="305" y="578">跨对话统一命名(产品名等)</text>
  <line x1="490" y1="555" x2="535" y2="555" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="540" y="510" width="180" height="90" rx="8" fill="#FFF4E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="bt" x="630" y="548" text-anchor="middle">3 按轮切分</text>
  <text class="item" x="550" y="578">每轮一条训练样本</text>
  <line x1="725" y1="555" x2="770" y2="555" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="775" y="510" width="180" height="90" rx="8" fill="#FFF4E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="bt" x="865" y="548" text-anchor="middle">4 逐轮特征提取</text>
  <text class="item" x="785" y="578">销售专用特征</text>
  <line x1="960" y1="555" x2="1005" y2="555" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="1010" y="510" width="100" height="90" rx="8" fill="#EAF7EA" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="bt" x="1060" y="540" text-anchor="middle">5 Azure</text>
  <text class="bt" x="1060" y="560" text-anchor="middle">3072 维</text>
  <text class="bt" x="1060" y="580" text-anchor="middle">embedding</text>

  <!-- 底部结果条 -->
  <rect x="30" y="640" width="1080" height="44" rx="8" fill="#FFF8E1" stroke="#D9822B" stroke-width="1.5"/>
  <text class="bar" x="570" y="668" text-anchor="middle" fill="#8A5A00">训练信号只有一个是真的:最终成交与否;逐轮概率标注是模拟的(原文口径) | 先验负样本 56% | 划分没披露(疑问 2)</text>
</svg>
